<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой TODO-лист</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f0f2f5;
        }
        h1 { color: #333; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #45a049; }
        .task {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .task.done {
            text-decoration: line-through;
            opacity: 0.6;
        }
        .task button {
            background: #f44336;
            padding: 5px 10px;
            font-size: 14px;
        }
        .task button:hover { background: #d32f2f; }
        .done-btn {
            background: #2196F3 !important;
            margin-right: 5px;
        }
        .done-btn:hover { background: #1976D2 !important; }
    </style>
</head>
<body>
    <h1>📋 Мой TODO-лист</h1>

    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Что нужно сделать?">
        <button onclick="addTask()">Добавить</button>
    </div>

    <div id="tasks"></div>

    <script>
        const API = "http://127.0.0.1:8000";

        // Загрузить все задачи
        async function loadTasks() {
            const response = await fetch(API + "/tasks");
            const data = await response.json();
            const tasksDiv = document.getElementById("tasks");
            tasksDiv.innerHTML = "";

            if (data.tasks.length === 0) {
                tasksDiv.innerHTML = "<p>Пока нет задач. Добавь первую!</p>";
                return;
            }

            data.tasks.forEach(task => {
                const div = document.createElement("div");
                div.className = "task" + (task.done ? " done" : "");
                div.innerHTML = `
                    <span>${task.title}</span>
                    <div>
                        <button class="done-btn" onclick="toggleTask(${task.id}, ${task.done})">
                            ${task.done ? "↩️" : "✅"}
                        </button>
                        <button onclick="deleteTask(${task.id})">🗑️</button>
                    </div>
                `;
                tasksDiv.appendChild(div);
            });
        }

        // Добавить задачу
        async function addTask() {
            const input = document.getElementById("taskInput");
            const title = input.value.trim();
            if (!title) return;

            await fetch(API + "/tasks", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({title: title, description: ""})
            });

            input.value = "";
            loadTasks();
        }

        // Отметить выполненной
        async function toggleTask(id, currentDone) {
            await fetch(API + "/tasks/" + id, {
                method: "PUT",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({done: !currentDone})
            });
            loadTasks();
        }

        // Удалить задачу
        async function deleteTask(id) {
            await fetch(API + "/tasks/" + id, {method: "DELETE"});
            loadTasks();
        }

        // Enter для добавления
        document.getElementById("taskInput").addEventListener("keypress", function(e) {
            if (e.key === "Enter") addTask();
        });

        // Загружаем задачи при открытии
        loadTasks();
    </script>
</body>
</html>
